name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate config shape
        run: python scripts/validate_config.py

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Tests
        run: pytest -q

  coverage-gate:
    name: Coverage Gate (>=70%)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enforce coverage threshold
        run: |
          pytest -q --cov=transform --cov=validation --cov=extract --cov=kafka1 --cov=load \
            --cov-report=term-missing --cov-fail-under=70

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start mock FakeStore API
        # fakestoreapi.com sits behind Cloudflare and increasingly returns 403
        # Forbidden to requests from shared/cloud IP ranges, GitHub Actions
        # runners included — even though the same call succeeds from a normal
        # connection. Serve the same JSON shape locally so this job tests our
        # extract -> validate -> transform code, not fakestoreapi.com's uptime
        # or IP allow-listing.
        run: |
          python scripts/mock_fakestore_server.py 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/products -o /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/products -o /dev/null || (echo "Mock FakeStore API failed to start" && exit 1)

      - name: Run extract -> validate -> transform against the mock FakeStore API
        env:
          FAKESTORE_API_URL: http://127.0.0.1:8000/products
        run: python run_local.py

      - name: Verify output was produced
        run: |
          test -s data/output.csv
          echo "Rows written: $(($(wc -l < data/output.csv) - 1))"

  ci-complete:
    name: CI Complete
    needs: [config-validation, coverage-gate, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "Lint, config validation, unit tests, coverage gate and integration tests all passed."
