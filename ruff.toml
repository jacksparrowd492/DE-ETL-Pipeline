# Lint scope for the "Lint & Format" CI job. Deliberately a practical
# baseline (pyflakes correctness rules + pycodestyle) rather than every
# rule ruff ships — long descriptive docstrings/comments are the house
# style here, so line-length is excluded rather than rewrapped everywhere.
line-length = 100

[lint]
select = ["E", "F", "W"]
ignore = ["E501"]
